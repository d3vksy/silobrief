name: 기능 제안
description: 작고 검증 가능한 기능 변경을 제안합니다.
title: "feat(scope): "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Replace `scope` in the title with a short area such as `example`, `review`, or `cli`.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 설명보다 현재 겪는 문제와 마지막 사례를 먼저 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 원하는 동작
      description: 사용자가 관찰할 수 있는 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 구현 여부를 판단할 수 있는 조건을 적어 주세요.
    validations:
      required: true
