name: Publish to PyPI

run-name: Publish siloBrief ${{ inputs.version }} to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ["RELEASE_VERSION"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+)?", version) is None:
              raise SystemExit("version must look like 1.0.0 or 1.0.0rc1, without a v prefix")
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("run this workflow from the main branch")
          PY

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/v${{ inputs.version }}

      - name: Validate tag and package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tag = f"v{version}"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tag_commit = subprocess.check_output(
              ["git", "rev-list", "-n", "1", f"refs/tags/{tag}"], text=True
          ).strip()
          if head != tag_commit:
              raise SystemExit(f"{tag} does not point to the checked-out commit")
          if subprocess.run(
              ["git", "merge-base", "--is-ancestor", head, "origin/main"], check=False
          ).returncode != 0:
              raise SystemExit(f"{tag} is not reachable from main")

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          if project["name"] != "silobrief" or project["version"] != version:
              raise SystemExit(
                  f"package metadata is {project['name']} {project['version']}, expected silobrief {version}"
              )
          PY

      - name: Install build tooling and package
        run: >-
          python -m pip install --disable-pip-version-check
          "build>=1.2,<2" "setuptools>=77" .

      - name: Run release tests
        run: python -m unittest discover -s tests -q

      - name: Build distributions
        run: python -m build

      - name: Verify distribution versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          files = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          expected = [
              f"silobrief-{version}-py3-none-any.whl",
              f"silobrief-{version}.tar.gz",
          ]
          if files != expected:
              raise SystemExit(f"unexpected distributions: {files}; expected {expected}")
          PY

      - name: Store distributions for the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ inputs.version }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/silobrief
    permissions:
      id-token: write

    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-${{ inputs.version }}
          path: dist/

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
